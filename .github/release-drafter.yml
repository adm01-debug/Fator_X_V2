template: |
  ## What's Changed

  $CHANGES

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '🛠️ Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'documentation'
      - 'refactor'

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'

tag-template: 'v$NEXT_PATCH_VERSION'
