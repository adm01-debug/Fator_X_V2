# docs:
#   gatilho: diario (05:17 UTC) e dispatch
#   prova: os alertas abertos do Dependabot aparecem em /security/vulnerabilities
#   falha: o job fica vermelho e a tela continua mostrando o estado anterior
#   avisa: nao abre PR -- escreve direto na tabela que a tela ja le
name: Sincronizar vulnerabilidades (Dependabot)

# A tela /security/vulnerabilities le public.vulnerability_findings, mas
# nenhum codigo jamais escreveu nessa tabela: 0 linhas com 19 alertas
# abertos no GitHub. O fluxo estava pela metade -- UI pronta, alimentador
# inexistente. Este job fecha o ciclo.
#
# Secrets: SUPABASE_ACCESS_TOKEN (mesmo token que o migrations-deploy usa
# para escrever) e DEPENDABOT_TOKEN (PAT do dono do repo).
#
# Por que PAT e nao o token do runner: `POST /dependabot/alerts` nao existe
# para o GITHUB_TOKEN -- ele responde 403 "Resource not accessible by
# integration" mesmo com `security-events: read` no permissions. O endpoint
# exige um token de usuario com acesso ao repositorio.

on:
  schedule:
    - cron: '17 5 * * *' # diario 05:17 UTC (02:17 BRT)
  workflow_dispatch:

concurrency:
  group: sincronizar-vulnerabilidades
  cancel-in-progress: false

permissions:
  contents: read
  security-events: read # ler os alertas do Dependabot

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  sincronizar:
    name: Dependabot -> vulnerability_findings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Guarda de autorizacao
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEPENDABOT_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente."
            exit 1
          fi
          if [ -z "${DEPENDABOT_TOKEN:-}" ]; then
            echo "::error::DEPENDABOT_TOKEN ausente - sem ele a API recusa ler os alertas (403)."
            exit 1
          fi

      - name: Sincronizar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: qdlnzopxrlsoljcrcmzv
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-dependabot-findings.mjs