name: Nexus CI

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # --audit-level=critical: react-router has overlapping HIGH advisories
      # covering ALL currently available versions (XSS/RCE ≤7.17, CSRF ≥7.12).
      # There is no release that clears both; the CSRF advisory only affects SSR
      # features this SPA does not use. CRITICAL is the actionable threshold.
      - run: npm audit --audit-level=critical --omit=dev
        continue-on-error: false

  db-drift-check:
    name: DB Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run db drift check (banco × repo)
        # Valida 3 invariantes: migrations repo=banco, RLS 100%, zero
        # escrita anon. Opt-in via DB_MCP_URL (sem secret → warning+skip).
        env:
          DB_MCP_URL: ${{ secrets.DB_MCP_URL }}
        run: node scripts/db-drift-check.mjs

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      # --format=json: ESLint 9.32.0 stylish formatter crashes (TypeError in stylish.js:67).
      # compact was removed from core in 9.x; json is a stable built-in that
      # exits non-zero on errors without crashing.
      - run: npx eslint src/ --ext .ts,.tsx --max-warnings 0 --format=json
      - name: Enforce nexus-design & no-explicit-any (zero regressions)
        run: |
          set -o pipefail
          npx eslint src/ --ext .ts,.tsx \
            --rule '{"@typescript-eslint/no-explicit-any":"error","nexus-design/no-hardcoded-colors":"error","nexus-design/no-adhoc-typography":"error","nexus-design/no-adhoc-shadows":"error"}' \
            -f json -o eslint-report.json || true
          node -e "
            const r = require('./eslint-report.json');
            const watched = new Set(['@typescript-eslint/no-explicit-any','nexus-design/no-hardcoded-colors','nexus-design/no-adhoc-typography','nexus-design/no-adhoc-shadows']);
            const violations = [];
            for (const f of r) for (const m of f.messages) if (watched.has(m.ruleId)) violations.push({file:f.filePath,line:m.line,rule:m.ruleId,msg:m.message});
            if (violations.length) {
              console.error('❌ ' + violations.length + ' violação(ões) das regras protegidas detectada(s):');
              for (const v of violations.slice(0,50)) console.error('  ' + v.rule + ' — ' + v.file + ':' + v.line + ' — ' + v.msg);
              if (violations.length > 50) console.error('  … +' + (violations.length-50) + ' outras');
              process.exit(1);
            }
            console.log('✅ Nenhuma nova violação de nexus-design ou no-explicit-any.');
          "
      - name: Integridade das instruções de agentes (AGENTS.md + docs/agentes)
        # Falha se outra sessão apagar/esvaziar AGENTS.md, CLAUDE.md ou docs/agentes/*.md.
        run: |
          git fetch --no-tags --depth=1 origin main
          AGENTS_MD_BASE=FETCH_HEAD node scripts/check-agents-md-integrity.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: eslint-guardrails-report
          path: eslint-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-audit]
    # A suíte completa roda em ~45s localmente. O teto de 15min transforma um
    # eventual hang (worker travado, timer falso vazando entre suítes) em falha
    # rápida em vez de um job de 6h — foi exatamente esse o modo de falha que
    # manteve a suíte global sem rodar por várias iterações.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run full unit suite (gate) + orçamento de duração
        run: |
          set -o pipefail
          START=$(date +%s)
          STATUS=0
          npx vitest run --reporter=verbose --coverage --testTimeout=20000 --hookTimeout=20000 || STATUS=$?
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Duração da suíte (com cobertura): ${ELAPSED}s — orçamento: 300s"
          if [ "$ELAPSED" -gt 300 ]; then
            echo "::error::Regressão de performance: a suíte levou ${ELAPSED}s (>300s). Investigue timers falsos não restaurados, rede real em jsdom ou loops de render."
            exit 1
          fi
          exit $STATUS

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: coverage/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh visual baselines for CI environment
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Run Playwright tests
        run: npx playwright test
      - name: Auth E2E status
        if: always()
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set — auth-flows.spec.ts skipped. Add the secret to enable full auth E2E coverage."
          else
            echo "Auth E2E ran with synthetic users."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            e2e/__screenshots__/

  edge-contracts:
    name: Edge Function Contract Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run edge function contract tests
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::warning::VITE_SUPABASE_URL secret not configured — edge contract tests skipped. Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY to enable live contract tests."
            exit 0
          fi
          deno test --allow-net --allow-env --allow-read --no-check \
            supabase/functions/_shared/edge-contract_test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Generate Audit PDF
        run: npm run docs:pdf
      - name: Bundle size budget
        run: npm run check:bundle
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-report
          path: dist/bundle-report.html

  lighthouse:
    name: Lighthouse CI (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Run Lighthouse CI (${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "mobile" ]; then
            npx @lhci/cli@0.15.x autorun --config=./lighthouserc.mobile.json
          else
            npx @lhci/cli@0.15.x autorun
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report-${{ matrix.profile }}
          path: .lighthouseci/

  load-test:
    name: Load Test (k6 — llm-gateway)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Smoke test (always)
        run: k6 run --vus 1 --duration 30s tests/load/llm-gateway.k6.js
      - name: Full load test (label-gated)
        if: contains(github.event.pull_request.labels.*.name, 'load-test')
        run: k6 run tests/load/llm-gateway.k6.js
      - name: Load test status
        if: always()
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not set — k6 ran in skip mode. Add the secret for real load coverage."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-summary
          path: summary.json

  notify-failure:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs:
      [
        security-audit,
        db-drift-check,
        lint-and-typecheck,
        unit-tests,
        e2e-tests,
        edge-contracts,
        build,
        lighthouse,
        load-test,
      ]
    # Gate: sem SLACK_WEBHOOK_URL configurado o job era skip-implícito-falhando
    # ("Specify secrets.SLACK_WEBHOOK_URL" → job vermelho em todo push com falha,
    # poluindo o sinal de CI). Agora: sem secret → warning explícito, job verde.
    if: failure() && github.event_name == 'push'
    steps:
      - name: Warn on missing Slack secret
        if: env.SLACK_WEBHOOK_URL == ''
        run: |
          echo "::warning::SLACK_WEBHOOK_URL não configurado nos secrets do repositório — notificação de falha do CI não será enviada. Configure o secret para ativar o alerta."
      - name: Slack Notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
