# docs:
#   gatilho: push em main tocando supabase/functions/ (ou manual via workflow_dispatch).
#   prova: deploy de todas as Edge Functions via Supabase CLI com SUPABASE_ACCESS_TOKEN.
#   falha: job vermelho = ao menos uma edge nao subiu; corrigir e re-disparar.
#   avisa: o resumo do run e a prova; usuario acompanha no GitHub Actions.

name: Edge Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/deploy-edge-functions.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Aplica secrets de runtime nas edges
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ausente — deploy pulado."
            exit 0
          fi
          apply_secret() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              npx --yes supabase secrets set "${name}=${value}" --remote=qdlnzopxrlsoljcrcmzv \
                || echo "::warning::falha ao setar secret ${name}"
            fi
          }
          apply_secret OPENROUTER_API_KEY "${{ secrets.OPENROUTER_API_KEY }}"
          apply_secret DEEPSEEK_API_KEY "${{ secrets.DEEPSEEK_API_KEY }}"
          apply_secret LOVABLE_API_KEY "${{ secrets.LOVABLE_API_KEY }}"
          apply_secret OPENCLAW_WEBHOOK_SECRET "${{ secrets.OPENCLAW_WEBHOOK_SECRET }}"
      - name: Deploy de todas as Edge Functions
        run: bash scripts/deploy-edge-functions.sh
