name: Schema Probe

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL somente leitura'
        required: true
        default: "select proname from pg_proc where proname in ('enable_my_2fa','disable_my_2fa','verify_my_2fa','hybrid_search_notebook') order by 1;"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qdlnzopxrlsoljcrcmzv
    steps:
      - name: Roda SQL na Management API
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente."
            exit 1
          fi
          cat > /tmp/q.json <<'JSON'
          {"query": "__SQL__"}
          JSON
          python3 - <<'PY'
          import json
          sql = """${{ inputs.sql }}"""
          with open('/tmp/q.json','w') as f:
              json.dump({"query": sql}, f)
          PY
          CODE=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/q.json)
          echo "HTTP $CODE"
          cat /tmp/out.json
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::Management API recusou a consulta (HTTP $CODE)."
            exit 1
          fi