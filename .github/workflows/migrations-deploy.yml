# docs:
#   gatilho: manual (workflow_dispatch) com confirmacao explicita.
#   prova: o log do run mostra as migrations pendentes (migration list) e o resultado do db push.
#   falha: job vermelho = nada foi aplicado; corrigir e re-disparar.
#   avisa: o resumo do run e a prova; usuario acompanha no GitHub Actions.

name: Migrations Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = so lista o que seria aplicado (nada e escrito)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      confirm:
        description: 'Para aplicar de verdade, digite: APLICAR'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: migrations-deploy
  cancel-in-progress: false

jobs:
  push:
    name: Aplicar migrations no Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qdlnzopxrlsoljcrcmzv
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Guarda de autorizacao
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente - sem ele nao da para falar com o Supabase."
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ inputs.confirm }}" != "APLICAR" ]; then
            echo "::error::Para aplicar de verdade o campo confirm deve ser exatamente APLICAR."
            exit 1
          fi

      - name: Link do projeto
        run: npx --yes supabase@2 link --project-ref "$PROJECT_REF"

      - name: Migrations pendentes
        run: npx --yes supabase@2 migration list

      - name: Aplicar
        if: ${{ inputs.dry_run == 'false' }}
        run: npx --yes supabase@2 db push --project-ref "$PROJECT_REF" --include-all --yes

      # dry_run=true e simulacao. Sem este aviso o job terminava verde e dava
      # a impressao de que a migration tinha sido aplicada -- foi assim que
      # uma migration ficou pendente com o run "success".
      - name: Aviso de simulacao
        if: ${{ inputs.dry_run != 'false' }}
        run: |
          echo "::warning::dry_run=true: NADA foi escrito no banco. Re-dispare com dry_run=false e confirm=APLICAR."
          echo "### Simulacao" >> "$GITHUB_STEP_SUMMARY"
          echo "**Nada foi aplicado.** dry_run=true." >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo
        run: |
          {
            echo "### Migrations"
            echo "- dry_run: \`${{ inputs.dry_run }}\`"
            echo "- confirm: \`${{ inputs.confirm }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- projeto: \`$PROJECT_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"