name: sonda-lgpd
on:
  push:
    paths: ['.github/workflows/sonda-lgpd.yml']
  workflow_dispatch: {}
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: consultar
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request
          REF='qdlnzopxrlsoljcrcmzv'
          def q(sql):
              req=urllib.request.Request(f'https://api.supabase.com/v1/projects/{REF}/database/query',
                  data=json.dumps({'query':sql}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN'],'Content-Type':'application/json'},
                  method='POST')
              try:
                  return json.loads(urllib.request.urlopen(req,timeout=90).read().decode())
              except Exception as e:
                  return {'error':str(e)}
          print('S1', q("""select table_name from information_schema.tables where table_schema='public' and table_name in ('session_traces','traces','agent_eval_runs','agent_memories')"""), flush=True)
          print('S2', q("""select column_name from information_schema.columns where table_schema='public' and table_name='workspace_members' and column_name in ('role','user_id','workspace_id')"""), flush=True)
          print('S3', q("""select indexdef from pg_indexes where schemaname='public' and tablename='consent_records'"""), flush=True)
          print('S4', q("""select column_name from information_schema.columns where table_schema='public' and table_name='sessions' order by ordinal_position"""), flush=True)
          PYEOF
