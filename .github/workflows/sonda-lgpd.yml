name: sonda-lgpd
on:
  push:
    paths: ['.github/workflows/sonda-lgpd.yml']
  workflow_dispatch: {}
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: consultar
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request
          REF='qdlnzopxrlsoljcrcmzv'
          def q(sql):
              req=urllib.request.Request(f'https://api.supabase.com/v1/projects/{REF}/database/query',
                  data=json.dumps({'query':sql}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN'],'Content-Type':'application/json'},
                  method='POST')
              try:
                  return json.loads(urllib.request.urlopen(req,timeout=90).read().decode())
              except Exception as e:
                  return {'error':str(e)}
          print('L1', q("""select table_name, column_name, data_type from information_schema.columns where table_schema='public' and table_name in ('consent_records','data_deletion_requests','agent_memories') order by table_name, ordinal_position"""), flush=True)
          print('L2', q("""select conrelid::regclass as t, conname, pg_get_constraintdef(oid) as def from pg_constraint where conrelid in ('public.consent_records'::regclass,'public.data_deletion_requests'::regclass) order by 1,2"""), flush=True)
          print('L3', q("""select count(*) c from public.consent_records"""), flush=True)
          print('L4', q("""select count(*) c from public.data_deletion_requests"""), flush=True)
          print('L5', q("""select proname, pg_get_function_identity_arguments(oid) args, prosecdef from pg_proc where pronamespace='public'::regnamespace and proname in ('consent_grant','consent_revoke')"""), flush=True)
          PYEOF
