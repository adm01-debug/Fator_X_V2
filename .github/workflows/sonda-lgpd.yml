name: sonda-lgpd
on:
  push:
    paths: ['.github/workflows/sonda-lgpd.yml']
  workflow_dispatch: {}
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: consultar
        run: |
          python3 - <<'PYEOF'
          import json,os,urllib.request
          REF='qdlnzopxrlsoljcrcmzv'
          def q(sql):
              req=urllib.request.Request(f'https://api.supabase.com/v1/projects/{REF}/database/query',
                  data=json.dumps({'query':sql}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN'],'Content-Type':'application/json'},
                  method='POST')
              try:
                  return json.loads(urllib.request.urlopen(req,timeout=90).read().decode())
              except Exception as e:
                  return {'error':str(e)}
          print('C1', q("""select column_name, data_type, is_nullable from information_schema.columns where table_schema='public' and table_name='consent_records' order by ordinal_position"""), flush=True)
          print('D1', q("""select column_name, data_type, is_nullable from information_schema.columns where table_schema='public' and table_name='data_deletion_requests' order by ordinal_position"""), flush=True)
          print('M1', q("""select column_name from information_schema.columns where table_schema='public' and table_name='agent_memories' and column_name in ('user_id','workspace_id','agent_id')"""), flush=True)
          print('T1', q("""select table_name, column_name from information_schema.columns where table_schema='public' and table_name in ('traces','agent_eval_runs','sessions') and column_name in ('user_id','workspace_id','created_by') order by 1"""), flush=True)
          PYEOF
