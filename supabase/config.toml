# Webhooks inbound de provedores externos (HMAC, nao JWT). Sem isso o gateway
# exige Bearer JWT e os provedores (Bitrix24, Meta/Zapi/Evolution, clientes
# genericos) recebem 401 ao chamar a edge.
[functions.bitrix24-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.webhook-receiver]
verify_jwt = false

# Chamada do gatilho notify_slack_on_agent_run() via pg_net: autentica por
# segredo compartilhado (x-slack-notify-secret), nao por JWT. Sem isso o
# gateway devolve 401 e a notificacao de agente nunca chega ao Slack.
[functions.slack-agent-notify]
verify_jwt = false
